name: Frontend quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "clicky/**"
      - "perplexity/**"
      - "review/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check patch whitespace
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "origin/$GITHUB_BASE_REF...HEAD"
          else
            git diff --check HEAD^
          fi
      - name: Run seeded fixture regression suite
        run: node --test
      - name: Validate the sanitized evidence example
        run: node scripts/validate-evidence.mjs test/fixtures/evidence/improved-comparison.json
